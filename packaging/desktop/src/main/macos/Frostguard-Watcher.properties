main-jar=frostguard-watcher-${project.version}.jar
main-class=dev.frostguard.watcher.TelegramWatcher
description=Frostguard Telegram Watcher
java-options=--enable-native-access=ALL-UNNAMED -Dfrostguard.channel=${frostguard.release.channel} -Dfrostguard.application.id=${frostguard.product.identifier} -Dfrostguard.update.pullRequestBuild=${frostguard.pull-request-build} "-Duser.dir=$APPDIR" "-Dfrostguard.launcher=$APPDIR/../MacOS/${frostguard.product.name}" "-Dfrostguard.watcher.launcher=$APPDIR/../MacOS/${frostguard.watcher.name}" "-Djna.library.path=$APPDIR/lib/tesseract/native"
