name: Discord — Refresh Stable Message

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Update the maintained Stable download
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test the Stable notifier
        run: python3 build-support/notifications/test_stable_release_notify.py

      - name: Resolve and publish the latest Stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_NIGHTLY_WEBHOOK_URL: ${{ secrets.DISCORD_NIGHTLY_WEBHOOK_URL }}
          DISCORD_STABLE_MESSAGE_ID: ${{ vars.DISCORD_STABLE_MESSAGE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")"
          tag="$(jq -r '.tag_name' <<< "${release}")"
          version="${tag#v}"
          release_url="$(jq -r '.html_url' <<< "${release}")"
          asset="Frostguard-${version}-windows-x64.msi"
          download_url="$(jq -r --arg asset "${asset}" \
            '[.assets[] | select(.name == $asset) | .browser_download_url] | if length == 1 then .[0] else empty end' \
            <<< "${release}")"
          if [[ -z "${download_url}" ]]; then
            echo "::error::Latest Stable does not contain exactly one ${asset}."
            exit 1
          fi
          code="$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 120 \
            --fail --retry 12 --retry-delay 5 --retry-all-errors \
            -r 0-1023 "${download_url}" || true)"
          if [[ "${code}" != "200" && "${code}" != "206" ]]; then
            echo "::error::Stable installer URL returned HTTP ${code}."
            exit 1
          fi
          archive_url="https://github.com/${GITHUB_REPOSITORY}/releases"

          python3 build-support/notifications/stable_release_notify.py \
            --version "${version}" \
            --download-url "${download_url}" \
            --release-url "${release_url}" \
            --archive-url "${archive_url}" \
            --message-id "${DISCORD_STABLE_MESSAGE_ID}"
