name: Discord — Deploy /build-pr Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Test and deploy the Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test the interaction worker
        run: node --test discord-bot/test_worker.mjs

      - name: Deploy the worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: discord-bot
          command: deploy
