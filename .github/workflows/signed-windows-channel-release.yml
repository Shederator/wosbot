name: Windows Channel Release

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release identity to publish"
        required: true
        type: choice
        options:
          - stable
          - nightly
      version:
        description: "Stable X.Y.Z or Nightly X.Y.Z-nightly.YYYYMMDD.N"
        required: true
        type: string
      minimum_updater_version:
        description: "Oldest Frostguard SemVer allowed to install this release"
        required: true
        default: "3.0.0-nightly.0"
        type: string

permissions: {}

concurrency:
  group: windows-${{ github.event_name == 'schedule' && 'nightly' || inputs.channel }}-release
  cancel-in-progress: false

jobs:
  release:
    name: Authenticate and publish ${{ github.event_name == 'schedule' && 'nightly' || inputs.channel }} Windows release
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      MAVEN_ARGS: "-B --no-transfer-progress -Dstyle.color=never"
      REQUESTED_CHANNEL: ${{ inputs.channel }}
      REQUESTED_VERSION: ${{ inputs.version }}
      REQUESTED_MINIMUM_UPDATER_VERSION: ${{ inputs.minimum_updater_version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out main with release assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Git LFS assets are real binaries
        shell: bash
        run: build-support/verification/check_lfs_assets.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.12+8.0"
          cache: maven

      - name: Install WiX Toolset 3
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1.20250415 --no-progress -y
          $wixBin = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (-not (Test-Path -LiteralPath (Join-Path $wixBin "candle.exe"))) {
              throw "WiX candle.exe was not installed below $wixBin"
          }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Resolve manual or scheduled release identity
        shell: pwsh
        run: |
          $channel = $env:REQUESTED_CHANNEL
          $version = $env:REQUESTED_VERSION
          $minimumUpdaterVersion = $env:REQUESTED_MINIMUM_UPDATER_VERSION
          if ($env:GITHUB_EVENT_NAME -eq 'schedule') {
              $channel = 'nightly'
              $version = ''
              $minimumUpdaterVersion = '3.0.0-nightly.0'
          }
          if ($channel -notin @('stable', 'nightly')) {
              throw "Release channel must be stable or nightly"
          }

          $manifestName = "frostguard-$channel-manifest.json"
          $previousVersion = ''
          $feedReleases = @()
          if ($channel -eq 'nightly') {
              $feedJson = gh api `
                  "repos/$($env:GITHUB_REPOSITORY)/releases/tags/nightly" 2>$null
              if ($LASTEXITCODE -eq 0) {
                  $feedReleases += ,($feedJson | ConvertFrom-Json)
              }
          } else {
              $feedJson = gh api "repos/$($env:GITHUB_REPOSITORY)/releases/latest" 2>$null
              if ($LASTEXITCODE -eq 0) {
                  $feedReleases += ,($feedJson | ConvertFrom-Json)
              }
          }

          foreach ($feedRelease in $feedReleases) {
              $manifestAssets = @($feedRelease.assets |
                  Where-Object { $_.name -ceq $manifestName })
              if ($manifestAssets.Count -gt 1) {
                  throw "Update feed contains duplicate $manifestName assets"
              }
              if ($manifestAssets.Count -eq 0) {
                  continue
              }
              $previousManifest = Join-Path $env:RUNNER_TEMP "previous-$manifestName"
              gh api "repos/$($env:GITHUB_REPOSITORY)/releases/assets/$($manifestAssets[0].id)" `
                  -H "Accept: application/octet-stream" > $previousManifest
              if ($LASTEXITCODE -ne 0) {
                  throw "Previous update manifest could not be downloaded"
              }
              $previousEnvelope = Get-Content -Raw -LiteralPath $previousManifest |
                  ConvertFrom-Json
              $projectKey = Get-Content -Raw `
                  modules/update/src/main/resources/dev/frostguard/update/project-update-key.properties `
                  | ConvertFrom-StringData
              if ($previousEnvelope.envelopeVersion -ne 1 -or
                  $previousEnvelope.algorithm -cne 'Ed25519' -or
                  $previousEnvelope.keyId -cne $projectKey.keyId) {
                  throw "Previous update feed is not a supported project-signed manifest"
              }
              $payloadBytes = [Convert]::FromBase64String($previousEnvelope.payload)
              $previousVersion = ([Text.Encoding]::UTF8.GetString($payloadBytes) |
                  ConvertFrom-Json).version
              break
          }

          if ($env:GITHUB_EVENT_NAME -eq 'schedule') {
              $versionArgs = @('--date', (Get-Date).ToUniversalTime().ToString('yyyyMMdd'))
              if ([string]::IsNullOrWhiteSpace($previousVersion)) {
                  $latestTag = gh api "repos/$($env:GITHUB_REPOSITORY)/releases/latest" `
                      --jq '.tag_name'
                  if ($LASTEXITCODE -ne 0 -or $latestTag -notmatch '^v(\d+\.\d+\.\d+)$') {
                      throw "A scheduled Nightly needs an existing Stable base version"
                  }
                  $versionArgs += @('--base-version', $Matches[1])
              } else {
                  $versionArgs += @('--previous-version', $previousVersion)
              }
              $version = python build-support/release/next_nightly_version.py @versionArgs
              if ($LASTEXITCODE -ne 0) {
                  throw "Could not derive the next scheduled Nightly version"
              }
              $version = $version.Trim()
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
              throw "A manual release requires a version"
          }
          if ([string]::IsNullOrWhiteSpace($minimumUpdaterVersion)) {
              throw "A release requires a minimum updater version"
          }
          @{
              CHANNEL = $channel
              VERSION = $version
              MINIMUM_UPDATER_VERSION = $minimumUpdaterVersion
              PREVIOUS_VERSION = $previousVersion
          }.GetEnumerator() | ForEach-Object {
              "$($_.Key)=$($_.Value)" | Out-File -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 -Append
          }

      - name: Validate immutable release identity
        id: identity
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
              throw "Version must use semantic versioning without build metadata"
          }
          if ($env:MINIMUM_UPDATER_VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
              throw "minimum_updater_version must use semantic versioning without build metadata"
          }
          if ($env:CHANNEL -eq 'stable' -and $env:VERSION.Contains('-')) {
              throw "Stable releases must not use a prerelease version"
          }
          $manifestName = "frostguard-$($env:CHANNEL)-manifest.json"
          $releaseTags = @(gh release list --repo $env:GITHUB_REPOSITORY `
              --limit 1000 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) {
              throw "Could not list existing releases"
          }
          $previousVersion = $env:PREVIOUS_VERSION
          $versionArgs = @('--channel', $env:CHANNEL, '--version', $env:VERSION)
          if (-not [string]::IsNullOrWhiteSpace($previousVersion)) {
              $versionArgs += @('--previous-version', $previousVersion)
          }
          $windowsVersion = python build-support/release/windows_installer_version.py @versionArgs
          if ($LASTEXITCODE -ne 0) {
              throw "Could not derive a monotonic Windows installer version"
          }
          $windowsVersion = $windowsVersion.Trim()
          $productName = if ($env:CHANNEL -eq 'nightly') { 'Frostguard Nightly' } else { 'Frostguard' }
          $profile = if ($env:CHANNEL -eq 'nightly') { ',windows-nightly' } else { '' }
          $tag = "v$($env:VERSION)"
          $assetPrefix = if ($env:CHANNEL -eq 'nightly') { 'Frostguard-Nightly' } else { 'Frostguard' }
          @{
              channel = $env:CHANNEL
              version = $env:VERSION
              windows_version = $windowsVersion
              product_name = $productName
              profile = $profile
              tag = $tag
              installer_name = "$assetPrefix-$($env:VERSION)-windows-x64.msi"
              manifest_name = $manifestName
          }.GetEnumerator() | ForEach-Object {
              "$($_.Key)=$($_.Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          if ($releaseTags -contains $tag) {
              throw "Immutable release $tag already exists"
          }

      - name: Configure optional Authenticode certificate
        id: certificate
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.FROSTGUARD_WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.FROSTGUARD_WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          AUTHENTICODE_PUBLISHER: ${{ secrets.FROSTGUARD_AUTHENTICODE_PUBLISHER }}
        shell: pwsh
        run: |
          $configuredCount = @(
              $env:SIGNING_CERTIFICATE_BASE64,
              $env:SIGNING_CERTIFICATE_PASSWORD,
              $env:AUTHENTICODE_PUBLISHER
          ).Where({ -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($configuredCount -eq 0) {
              "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              "publisher=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Output "Authenticode is not configured; project signing remains mandatory."
              exit 0
          }
          if ($configuredCount -ne 3) {
              throw "Authenticode certificate, password, and publisher must be configured together"
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "frostguard-release-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath,
              [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Get-PfxCertificate -FilePath $certificatePath -Password $password
          if ($certificate.Subject -cne $env:AUTHENTICODE_PUBLISHER) {
              throw "Signing certificate subject does not match the pinned publisher"
          }
          Import-PfxCertificate -FilePath $certificatePath -Password $password `
              -CertStoreLocation Cert:\CurrentUser\My | Out-Null
          "thumbprint=$($certificate.Thumbprint)" | Out-File `
              -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "path=$certificatePath" | Out-File `
              -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "publisher=$($certificate.Subject)" | Out-File `
              -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build channel application image and installer
        shell: pwsh
        env:
          WINDOWS_VERSION: ${{ steps.identity.outputs.windows_version }}
          EXTRA_PROFILE: ${{ steps.identity.outputs.profile }}
          AUTHENTICODE_PUBLISHER: ${{ steps.certificate.outputs.publisher }}
        run: |
          $mavenArgs = $env:MAVEN_ARGS -split " "
          $profiles = "windows-app-image,windows-installer$($env:EXTRA_PROFILE)"
          $stableManifest = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/latest/download/frostguard-stable-manifest.json"
          $nightlyManifest = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/nightly/frostguard-nightly-manifest.json"
          & .\mvnw.cmd @mavenArgs "-Drevision=$($env:VERSION)" `
              "-Dfrostguard.windows.app-version=$($env:WINDOWS_VERSION)" `
              "-Dfrostguard.update.authenticode-publisher=$($env:AUTHENTICODE_PUBLISHER)" `
              "-Dfrostguard.update.manifest.stable=$stableManifest" `
              "-Dfrostguard.update.manifest.nightly=$nightlyManifest" `
              "-P$profiles" package

      - name: Verify and smoke-test channel application image
        shell: pwsh
        env:
          PRODUCT_NAME: ${{ steps.identity.outputs.product_name }}
        run: |
          $image = "packaging/desktop/target/app-image/$($env:PRODUCT_NAME)"
          $verificationArgs = @(
              $image, '--channel', $env:CHANNEL, '--product-name', $env:PRODUCT_NAME
          )
          if ($env:CHANNEL -eq 'nightly') {
              $verificationArgs += @(
                  '--expected-desktop-launcher-sha256',
                  '5c728d3662d64c428d003874f6d62b798bbbe329f595b2b15a2ab5ab1fd1faa9',
                  '--expected-watcher-launcher-sha256',
                  '9c7452d890f39c7f4fdb2e5519993514c84f071deef222fe49784acfd459c209'
              )
          } else {
              $verificationArgs += @(
                  '--expected-desktop-launcher-sha256',
                  '06610c6684f6323edf915a713d6a29cbc488d49f044685b80eabcfb1f7ca0a53',
                  '--expected-watcher-launcher-sha256',
                  'ed6a92c9e42bf4b205c669771bef4cbcd9e4d8674678f89cf944f965922f714e'
              )
          }
          python build-support/verification/verify_app_image.py @verificationArgs
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass `
              -File build-support/verification/smoke_test_app_image.ps1 `
              -ImagePath $image -Channel $env:CHANNEL -ProductName $env:PRODUCT_NAME

      - name: Prepare immutable installer and verify optional Authenticode
        id: installer
        shell: pwsh
        env:
          IMMUTABLE_NAME: ${{ steps.identity.outputs.installer_name }}
          CERTIFICATE_THUMBPRINT: ${{ steps.certificate.outputs.thumbprint }}
          AUTHENTICODE_ENABLED: ${{ steps.certificate.outputs.enabled }}
          AUTHENTICODE_PUBLISHER: ${{ steps.certificate.outputs.publisher }}
        run: |
          $source = @(Get-ChildItem "packaging/desktop/target/installers/$($env:CHANNEL)" `
              -Filter '*.msi' -File)
          if ($source.Count -ne 1) {
              throw "Expected exactly one unsigned installer, found $($source.Count)"
          }
          $installer = Join-Path $env:RUNNER_TEMP $env:IMMUTABLE_NAME
          Copy-Item -LiteralPath $source[0].FullName -Destination $installer
          if ($env:AUTHENTICODE_ENABLED -eq 'true') {
              $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
                  -Recurse -Filter signtool.exe | Where-Object FullName -Match '\\x64\\' `
                  | Sort-Object FullName -Descending | Select-Object -First 1
              if ($null -eq $signtool) {
                  throw "Windows SDK signtool.exe was not found"
              }
              & $signtool.FullName sign /sha1 $env:CERTIFICATE_THUMBPRINT /fd SHA256 `
                  /td SHA256 /tr http://timestamp.digicert.com $installer
              & $signtool.FullName verify /pa /v $installer
              if ($LASTEXITCODE -ne 0) {
                  throw "Authenticode verification failed"
              }
              $signature = Get-AuthenticodeSignature -LiteralPath $installer
              if ($signature.Status -ne 'Valid' -or
                  $signature.SignerCertificate.Subject -cne $env:AUTHENTICODE_PUBLISHER) {
                  throw "Signed installer does not match the pinned publisher"
              }
          } else {
              Write-Warning "Installer has no Windows verified publisher; the project-signed manifest is the trust root."
          }
          "path=$installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create draft release and verify uploaded installer
        id: draft
        shell: pwsh
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          INSTALLER: ${{ steps.installer.outputs.path }}
        run: |
          $title = if ($env:CHANNEL -eq 'nightly') {
              if ($env:VERSION -notmatch '^\d+\.\d+\.\d+-nightly\.(\d{4})(\d{2})(\d{2})\.(\d+)$') {
                  throw "Nightly title requires X.Y.Z-nightly.YYYYMMDD.N"
              }
              "Frostguard $($env:VERSION.Split('-')[0]) Nightly - " +
                  "$($Matches[1])-$($Matches[2])-$($Matches[3]) #$($Matches[4])"
          } else {
              "Frostguard $($env:VERSION)"
          }
          gh release create $env:TAG $env:INSTALLER --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA --title $title --generate-notes --draft
          if ($LASTEXITCODE -ne 0) {
              throw "Draft release creation failed"
          }
          $releasesJson = gh api "repos/$($env:GITHUB_REPOSITORY)/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) {
              throw "Draft releases could not be listed"
          }
          $releases = $releasesJson | ConvertFrom-Json
          $matchingReleases = @($releases |
              Where-Object { $_.tag_name -ceq $env:TAG })
          if ($matchingReleases.Count -ne 1 -or -not $matchingReleases[0].draft) {
              throw "Draft release could not be resolved uniquely"
          }
          $release = $matchingReleases[0]
          $assetName = [IO.Path]::GetFileName($env:INSTALLER)
          $matchingAssets = @($release.assets | Where-Object { $_.name -ceq $assetName })
          if ($matchingAssets.Count -ne 1) {
              throw "Uploaded installer could not be resolved"
          }
          $asset = $matchingAssets[0]
          $downloaded = Join-Path $env:RUNNER_TEMP "uploaded-installer.msi"
          gh api "repos/$($env:GITHUB_REPOSITORY)/releases/assets/$($asset.id)" `
              -H "Accept: application/octet-stream" > $downloaded
          if ($LASTEXITCODE -ne 0) {
              throw "Uploaded installer could not be downloaded for verification"
          }
          if ((Get-FileHash $downloaded -Algorithm SHA256).Hash -ne
              (Get-FileHash $env:INSTALLER -Algorithm SHA256).Hash) {
              throw "Uploaded installer hash does not match the signed source"
          }
          $publicInstallerUrl = "https://github.com/$($env:GITHUB_REPOSITORY)" +
              "/releases/download/$($env:TAG)/$assetName"
          "download_url=$publicInstallerUrl" | Out-File `
              -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Generate and project-sign update manifest
        id: manifest
        shell: pwsh
        env:
          INSTALLER: ${{ steps.installer.outputs.path }}
          INSTALLER_URL: ${{ steps.draft.outputs.download_url }}
          MANIFEST_NAME: ${{ steps.identity.outputs.manifest_name }}
          TAG: ${{ steps.identity.outputs.tag }}
          AUTHENTICODE_PUBLISHER: ${{ steps.certificate.outputs.publisher }}
          FROSTGUARD_UPDATE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.FROSTGUARD_UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          $manifest = Join-Path $env:RUNNER_TEMP $env:MANIFEST_NAME
          $payload = Join-Path $env:RUNNER_TEMP "payload-$($env:MANIFEST_NAME)"
          $publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $releaseNotes = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/tag/$($env:TAG)"
          $manifestArgs = @(
              '--channel', $env:CHANNEL, '--version', $env:VERSION,
              '--minimum-updater-version', $env:MINIMUM_UPDATER_VERSION,
              '--published-at', $publishedAt, '--release-notes-url', $releaseNotes,
              '--installer-url', $env:INSTALLER_URL, '--installer', $env:INSTALLER,
              '--output', $payload
          )
          if (-not [string]::IsNullOrWhiteSpace($env:AUTHENTICODE_PUBLISHER)) {
              $manifestArgs += @('--publisher', $env:AUTHENTICODE_PUBLISHER)
          }
          python build-support/release/write_update_manifest.py @manifestArgs
          if ([string]::IsNullOrWhiteSpace($env:FROSTGUARD_UPDATE_SIGNING_PRIVATE_KEY_BASE64)) {
              throw "FROSTGUARD_UPDATE_SIGNING_PRIVATE_KEY_BASE64 is not configured"
          }
          java -cp modules/update/target/classes dev.frostguard.update.ProjectManifestSigner `
              sign $payload $manifest
          $verificationClasspath = "modules/update/target/classes;modules/api/target/classes;packaging/desktop/target/input/lib/*"
          java -cp $verificationClasspath dev.frostguard.update.ProjectManifestSigner verify $manifest
          if ($LASTEXITCODE -ne 0) {
              throw "Project-signed update manifest verification failed"
          }
          Remove-Item -LiteralPath $payload -Force
          "path=$manifest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish immutable release and channel manifest last
        id: publish
        shell: pwsh
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          MANIFEST: ${{ steps.manifest.outputs.path }}
        run: |
          gh release upload $env:TAG $env:MANIFEST --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
              throw "Signed manifest could not be uploaded to the immutable release"
          }
          if ($env:CHANNEL -eq 'stable') {
              gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
              if ($LASTEXITCODE -ne 0) {
                  throw "Stable release could not be published"
              }
          } else {
              gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
              if ($LASTEXITCODE -ne 0) {
                  throw "Nightly immutable release could not be published"
              }
              $releaseTags = @(gh release list --repo $env:GITHUB_REPOSITORY `
                  --limit 1000 --json tagName --jq '.[].tagName')
              if ($LASTEXITCODE -ne 0) {
                  throw "Could not list releases before Nightly feed promotion"
              }
              $immutableUrl = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/tag/$($env:TAG)"
              $channelUrl = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/tag/nightly"
              $channelNotes = @"
          Permanent Frostguard Nightly channel.

          **Current build:** [$($env:VERSION)]($immutableUrl)

          Download the Windows x64 MSI from that immutable release. This rolling
          channel contains only the project-signed update manifest used to select
          and verify the current installer.

          Stable: https://github.com/$($env:GITHUB_REPOSITORY)/releases/latest
          "@
              if (-not ($releaseTags -contains 'nightly')) {
                  gh release create nightly --repo $env:GITHUB_REPOSITORY `
                      --target $env:GITHUB_SHA --title "Frostguard Nightly - Latest" `
                      --notes $channelNotes --prerelease
                  if ($LASTEXITCODE -ne 0) {
                      throw "Permanent Nightly channel could not be created"
                  }
              } else {
                  $rollingJson = gh api `
                      "repos/$($env:GITHUB_REPOSITORY)/releases/tags/nightly"
                  if ($LASTEXITCODE -ne 0) {
                      throw "Permanent Nightly channel could not be resolved"
                  }
              }

              gh release upload nightly $env:MANIFEST --repo $env:GITHUB_REPOSITORY --clobber
              if ($LASTEXITCODE -ne 0) {
                  throw "Permanent Nightly manifest could not be promoted"
              }
              $rollingJson = gh api `
                  "repos/$($env:GITHUB_REPOSITORY)/releases/tags/nightly"
              if ($LASTEXITCODE -ne 0) {
                  throw "Permanent Nightly channel could not be resolved after promotion"
              }
              $rolling = $rollingJson | ConvertFrom-Json
              foreach ($asset in @($rolling.assets |
                  Where-Object { $_.name -cne 'frostguard-nightly-manifest.json' })) {
                  gh api --method DELETE `
                      "repos/$($env:GITHUB_REPOSITORY)/releases/assets/$($asset.id)"
                  if ($LASTEXITCODE -ne 0) {
                      throw "Legacy Nightly asset $($asset.name) could not be retired"
                  }
              }
              gh release edit nightly --repo $env:GITHUB_REPOSITORY `
                  --title "Frostguard Nightly - Latest" --notes $channelNotes `
                  --target $env:GITHUB_SHA --prerelease
              if ($LASTEXITCODE -ne 0) {
                  throw "Permanent Nightly channel metadata could not be updated"
              }
              gh api --method PATCH `
                  "repos/$($env:GITHUB_REPOSITORY)/git/refs/tags/nightly" `
                  -f sha=$env:GITHUB_SHA -F force=true | Out-Null
              if ($LASTEXITCODE -ne 0) {
                  throw "Permanent Nightly tag could not be moved to the current build"
              }
              "channel_url=$channelUrl" | Out-File -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 -Append
              "release_url=$immutableUrl" | Out-File -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 -Append
          }

      - name: Update the maintained Nightly Discord message
        if: always() && env.CHANNEL == 'nightly'
        continue-on-error: true
        env:
          DISCORD_NIGHTLY_WEBHOOK_URL: ${{ secrets.DISCORD_NIGHTLY_WEBHOOK_URL }}
          DISCORD_DAILY_MESSAGE_ID: ${{ vars.DISCORD_DAILY_MESSAGE_ID }}
          JOB_STATUS: ${{ job.status }}
          INSTALLER_URL: ${{ steps.draft.outputs.download_url }}
          RELEASE_URL: ${{ steps.publish.outputs.release_url }}
          CHANNEL_URL: ${{ steps.publish.outputs.channel_url }}
          TAG: ${{ steps.identity.outputs.tag }}
        shell: pwsh
        run: |
          $notificationArgs = @(
              '--status', $env:JOB_STATUS.ToLowerInvariant(),
              '--version', $env:VERSION,
              '--download-url', $env:INSTALLER_URL,
              '--release-url', $env:RELEASE_URL,
              '--channel-url', $env:CHANNEL_URL,
              '--run-url', "$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)",
              '--repository', $env:GITHUB_REPOSITORY,
              '--message-id', $env:DISCORD_DAILY_MESSAGE_ID
          )
          python build-support/notifications/discord_notify.py @notificationArgs

      - name: Remove an abandoned draft release
        if: failure() && steps.draft.outcome != 'skipped'
        shell: pwsh
        env:
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          $releasesJson = gh api "repos/$($env:GITHUB_REPOSITORY)/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) {
              throw "Could not inspect releases during draft cleanup"
          }
          $releases = $releasesJson | ConvertFrom-Json
          $release = $releases | Where-Object { $_.tag_name -ceq $env:TAG } |
              Select-Object -First 1
          if ($null -ne $release -and $release.draft) {
              gh api --method DELETE `
                  "repos/$($env:GITHUB_REPOSITORY)/releases/$($release.id)"
              if ($LASTEXITCODE -ne 0) {
                  throw "Abandoned draft release could not be removed"
              }
          }

      - name: Upload authenticated release evidence
        uses: actions/upload-artifact@v4
        with:
          name: frostguard-${{ steps.identity.outputs.channel }}-${{ steps.identity.outputs.version }}-authenticated-release
          path: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.manifest.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Remove the temporary certificate file
        if: always()
        shell: pwsh
        env:
          CERTIFICATE_PATH: ${{ steps.certificate.outputs.path }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_PATH)) {
              Remove-Item -LiteralPath $env:CERTIFICATE_PATH -Force -ErrorAction SilentlyContinue
          }
